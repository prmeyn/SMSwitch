# Dependabot version updates. Two ecosystems: the NuGet packages the three projects reference, and
# the actions used by the release workflow.
#
# Every entry ignores semver-major updates. This library is on the authentication path and spends
# real money per message, so a major bump is a deliberate, reviewed act — not something that
# arrives while nobody is looking.
version: 2

updates:
  - package-ecosystem: "nuget"
    # Versions live in each .csproj (there is no Directory.Packages.props), so the project folders
    # are listed individually.
    #
    # The repository root is deliberately absent. It holds SMSwitch.sln, which resolves these same
    # three projects, so listing both made Dependabot discover every dependency twice: the first run
    # produced #8 (own-packages) and #9 (microsoft), then a catch-all PR #10 carrying all 11 updates
    # superseded and closed them both. One mislabelled PR, not the intended split.
    directories:
      - "/SMSwitch"
      - "/SMSwitch.Tests"
      - "/TestAPIs"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    ignore:
      # Twilio is deliberately absent from this list, so its major releases DO get offered: it is
      # the one dependency where the fix for an advisory is most likely to live only in a new major,
      # and an unreachable fix on the authentication path is worse than a breaking-change review.
      #
      # Everything else is still held to its current major. Dependabot's ignore has no negation, so
      # "all but Twilio" can only be spelled out. That inverts the default: a package added to a
      # .csproj and not added here will have its major bumps offered too. Prefix patterns cover the
      # families (Mongo* deliberately also catches MongoDB.* should it ever be referenced directly).
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "xunit*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Mongo*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "uSignIn.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Meyn.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "EarthCountriesInfo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "HumanLanguages"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Plivo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "SharpCompress"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Snappier"
        update-types: ["version-update:semver-major"]
      - dependency-name: "coverlet.collector"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Swashbuckle.AspNetCore"
        update-types: ["version-update:semver-major"]
    # Intended split: the sibling packages first, then Microsoft/System, then the remainder. The
    # catch-all "*" must stay last, or it claims everything. Confirm against a real run rather than
    # trusting this comment — the config this replaced did not split the way it claimed.
    groups:
      own-packages:
        # Listed by name because these share no prefix. A new package from the same org lands in
        # third-party until it is added here.
        patterns:
          - "EarthCountriesInfo"
          - "HumanLanguages"
          - "Meyn.Utilities"
          - "MongoDbService"
          - "MongoDbTokenManager"
          - "uSignIn.CommonSettings"
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      third-party:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    # Always the repo root; Dependabot reads .github/workflows from there.
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
